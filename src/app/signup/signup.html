<div class="wrap">
  <div class="card">
    <h1>TEE PEE</h1>
    <p class="sub">Create an account to get started.</p>

    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="you@example.com"
             [value]="email()" (input)="setEmail($any($event.target).value)"
             (keyup.enter)="submit()">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="At least 6 characters"
             [value]="password()" (input)="setPassword($any($event.target).value)"
             (keyup.enter)="submit()">
    </div>

    <div class="field">
      <label>Confirm password</label>
      <input type="password" placeholder="Re-enter your password"
             [value]="confirmPassword()" (input)="setConfirmPassword($any($event.target).value)"
             (keyup.enter)="submit()">
    </div>

    @if (errorMessage()) {
      <small class="error-text">{{ errorMessage() }}</small>
    }

    <button class="btn btn-primary" [disabled]="loading()" (click)="submit()">
      {{ loading() ? 'Creating account...' : 'Create account' }}
    </button>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
