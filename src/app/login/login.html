<div class="wrap">
  <div class="card">
    <h1>TEE PEE</h1>
    <p class="sub">Sign in to manage your properties.</p>

    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="you@example.com"
             [value]="email()" (input)="setEmail($any($event.target).value)"
             (keyup.enter)="submit()">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="Your password"
             [value]="password()" (input)="setPassword($any($event.target).value)"
             (keyup.enter)="submit()">
    </div>

    @if (errorMessage()) {
      <small class="error-text">{{ errorMessage() }}</small>
    }

    <button class="btn btn-primary" [disabled]="loading()" (click)="submit()">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
       
  </div>
</div>
